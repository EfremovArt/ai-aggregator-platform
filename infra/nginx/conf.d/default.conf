upstream api_upstream {
    server api:4000;
    keepalive 32;
}
upstream web_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health endpoint
    location = /health {
        proxy_pass http://api_upstream/api/health;
    }

    # Backend API
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_conn conn_zone 50;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_buffering off;          # for SSE streaming
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Frontend
    location / {
        limit_req zone=web_zone burst=200 nodelay;
        limit_conn conn_zone 100;

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long-lived static assets
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 25m;
}
